name: Site checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check links and images
        run: python3 scripts/check_site_links.py
      - name: Check pricing and cart totals
        run: node --test tests/pricing.test.cjs
